# Par. 2.12 - Questo pod supera la quota del namespace development (limits.memory)
apiVersion: v1
kind: Pod
metadata:
  name: nginx2
  namespace: development
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    resources:
      requests:
        cpu: 250m
        memory: 640Mi
      limits:
        cpu: 500m
        memory: 640Mi
