# Par. 2.20 - Blue/green: due Deployment identici tranne la versione; il Service sceglie quale servire
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-app-blue
spec:
  replicas: 2
  selector:
    matchLabels: {app: my-nginx-app, version: blue}
  template:
    metadata:
      labels: {app: my-nginx-app, version: blue}
    spec:
      containers:
      - name: web
        image: traefik/whoami:v1.12
        args: ["--name", "BLUE"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-app-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: my-nginx-app, version: green}
  template:
    metadata:
      labels: {app: my-nginx-app, version: green}
    spec:
      containers:
      - name: web
        image: traefik/whoami:v1.12
        args: ["--name", "GREEN"]
---
apiVersion: v1
kind: Service
metadata:
  name: my-inbound-service
spec:
  selector:
    app: my-nginx-app
    version: blue
  ports:
  - port: 80
