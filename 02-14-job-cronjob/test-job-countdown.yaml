# Par. 2.14 - Job: esegue 2 volte (completions), un pod alla volta (parallelism), un conto alla rovescia
apiVersion: batch/v1
kind: Job
metadata:
  name: test-job-countdown
spec:
  completions: 2
  parallelism: 1
  backoffLimit: 4
  ttlSecondsAfterFinished: 600   # il Job (e i suoi pod) viene eliminato 10 minuti dopo la fine
  template:
    spec:
      containers:
      - name: counter
        image: alpine:3.22
        command:
        - "/bin/sh"
        - "-c"
        - "for i in 9 8 7 6 5 4 3 2 1 ; do echo $i ; done"
      restartPolicy: Never
