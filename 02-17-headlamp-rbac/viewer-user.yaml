# Par. 2.17 - Account di servizio in sola lettura (principio del privilegio minimo)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer-user
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: viewer-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: viewer-user
  namespace: kube-system
