# Par. 2.18 - Pod che tollera il taint sku=gpu:NoSchedule.
# La toleration PERMETTE al pod di andare sul nodo "macchiato", ma non lo OBBLIGA:
# per dedicare davvero il nodo, la combiniamo con un nodeSelector sull'etichetta sku=gpu.
kind: Pod
apiVersion: v1
metadata:
  name: tf-mnist-toleration
spec:
  containers:
  - name: tf-mnist
    image: registry.k8s.io/pause:3.10
  tolerations:
  - key: "sku"
    operator: "Equal"
    value: "gpu"
    effect: "NoSchedule"
  nodeSelector:
    sku: gpu
