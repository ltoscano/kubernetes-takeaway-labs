# Par. 2.19 - Generatore di carico: 2 pod che interrogano il service my-nginx in un ciclo infinito
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load
        image: busybox:1.37
        command: ["/bin/sh", "-c", "while true; do wget -q -O- http://my-nginx >/dev/null; done"]
