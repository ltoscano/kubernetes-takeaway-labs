# Par. 2.11 - Seconda applicazione: un piccolo server HTTP che risponde con il nome del pod (Hostname)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-2-deploy
  labels:
    app: test-2-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-2-deploy
  template:
    metadata:
      labels:
        app: test-2-deploy
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.12
        ports:
        - containerPort: 80
