# Par. 2.11 - Due service ClusterIP: myserviceing1 -> test-deploy-1, myserviceing2 -> test-2-deploy
apiVersion: v1
kind: Service
metadata:
  name: myserviceing1
  annotations:
    haproxy.org/check: "true"
    haproxy.org/forwarded-for: "true"
    haproxy.org/load-balance: "roundrobin"
spec:
  selector:
    app: test-deploy-1
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: myserviceing2
  annotations:
    haproxy.org/check: "true"
    haproxy.org/forwarded-for: "true"
    haproxy.org/load-balance: "roundrobin"
spec:
  selector:
    app: test-2-deploy
  ports:
  - name: http
    port: 80
    targetPort: 80
