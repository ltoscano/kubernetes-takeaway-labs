# Lo stesso fan-out del par. 2.11 (foo.bar/hello e foo.bar/getdate) espresso con la Gateway API
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: foo-bar-gateway
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: foo-bar-route
spec:
  parentRefs:
  - name: foo-bar-gateway
  hostnames:
  - foo.bar
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /hello
    backendRefs:
    - name: myserviceing2
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /getdate
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: myserviceing1
      port: 80
