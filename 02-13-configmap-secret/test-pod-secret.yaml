# Par. 2.13 - Le chiavi del Secret my-secret diventano variabili d'ambiente (in chiaro) del container
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-secret
spec:
  restartPolicy: Never
  containers:
  - name: test-container
    image: alpine:3.22
    command: [ "/bin/sh", "-c", "env | sort" ]
    envFrom:
    - secretRef:
        name: my-secret
