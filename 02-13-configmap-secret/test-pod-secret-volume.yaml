# Par. 2.13 - Lo stesso Secret montato come volume: una chiave = un file
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-secret-volume
spec:
  restartPolicy: Never
  containers:
  - name: test-container
    image: alpine:3.22
    command: [ "/bin/sh", "-c", "ls -l /etc/credenziali; echo; cat /etc/credenziali/user; echo" ]
    volumeMounts:
    - name: credenziali
      mountPath: /etc/credenziali
      readOnly: true
  volumes:
  - name: credenziali
    secret:
      secretName: my-secret
