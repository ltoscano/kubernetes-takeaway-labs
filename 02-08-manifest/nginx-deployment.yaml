# Par. 2.8 - Primo manifest: un Deployment con 3 repliche di nginx
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    environment: development
spec:
  selector:
    matchLabels:
      app: web
  replicas: 3
  template:
    metadata:
      labels:
        environment: development
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        imagePullPolicy: Always
        ports:
        - containerPort: 80
