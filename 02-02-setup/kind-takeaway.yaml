# Kubernetes TakeAway, seconda edizione - cluster di laboratorio a 3 nodi (1 control plane + 2 worker)
# Ogni "nodo" è un container Docker (stesso principio Docker-in-Docker della 1a edizione).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: takeaway
networking:
  # Come nel libro: installiamo noi il plug-in CNI (Flannel), quindi disattiviamo quello di default (kindnet)
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"     # equivale a kubeadm init --pod-network-cidr
  serviceSubnet: "10.96.0.0/20"  # equivale a kubeadm init --service-cidr
  kubeProxyMode: "iptables"      # alternative: "nftables" (GA dalla 1.33) oppure "ipvs" (deprecata dalla 1.35)
nodes:
- role: control-plane
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  extraPortMappings:
  # NodePort dell'Ingress controller HAProxy (par. 2.11) raggiungibili da http://localhost:30080 e https://localhost:30443
  - containerPort: 30080
    hostPort: 30080
  - containerPort: 30443
    hostPort: 30443
- role: worker
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
- role: worker
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
